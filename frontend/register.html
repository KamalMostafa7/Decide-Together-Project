<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="register_title">Register - Decide Together</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .link-text {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 500;
        }

        .link-text:hover {
            text-decoration: underline;
            color: #0a58ca;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-hands-helping"></i>
                <span data-key="app_name">Decide Together</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="fas fa-home"></i>
                            <span data-key="nav_home">Home</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/browse.html">
                            <i class="fas fa-th-large"></i>
                            <span data-key="nav_browse">Browse Reports</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/map.html">
                            <i class="fas fa-map-marked-alt"></i>
                            <span data-key="nav_map">Reports Map</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-sm btn-outline-light" id="langToggle">
                            <i class="fas fa-language"></i> 
                            <span id="currentLang">AR</span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h3 data-key="register_heading">Register</h3>
                    </div>
                    <div class="card-body">
                        <div id="registerAlert" class="alert d-none"></div>

                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="name" class="form-label" data-key="label_name">Full Name</label>
                                <input type="text" class="form-control" id="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label" data-key="label_email">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label" data-key="label_password">Password</label>
                                <input type="password" class="form-control" id="password" required minlength="6">
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label"
                                    data-key="label_confirm_password">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100"
                                data-key="btn_register">Register</button>
                        </form>

                        <div class="text-center mt-3">
                            <p>
                                <span data-key="have_account">Already have an account?</span>
                                <a href="/login.html" class="link-text" data-key="link_login">Login here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/lang.js"></script>
    <script src="js/darkMode.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
